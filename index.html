<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogo Tecnologico</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <div class="row g-3">
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <span class="badge bg-success align-self-start mb-2">En Stock</span>
            <h5 class="card-title">Mouse RGB 16k</h5>
            <p class="card-text text-success fw-bold fs-5 mt-auto">$45.00</p>
            <button class="btn btn-primary w-100">Comprar</button>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100">
        <div class="card-body d-flex flex-column">
        <span class="badge bg-success align-self-start mb-2">En Stock</span>
        <h5 class="card-title">Teclado Mecanico</h5>
        <p class="card-text text-success fw-bold fs-5 mt-auto">$85.00</p>
        <button class="btn btn-primary w-100">Comprar</button>
        </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <span class="badge bg-warning text-dark align-self-start mb-2">Pocas Unidades</span>
           <h5 class="card-title">Audifonos 7.1</h5>
            <p class="card-text text-success fw-bold fs-5 mt-auto">$65.00</p>
            <button class="btn btn-primary w-100">Comprar</button>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <span class="badge bg-danger align-self-start mb-2">Agotado</span>
            <h5 class="card-title">Monitor 240Hz</h5>
            <p class="card-text text-success fw-bold fs-5 mt-auto">$299.00</p>
            <button class="btn btn-secondary w-100" disabled>Sin Stock</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
